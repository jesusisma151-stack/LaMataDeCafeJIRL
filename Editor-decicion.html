<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Editor - JIRL</title>
    
    <!-- Fuentes (Poppins para botones, Playfair Display para el encabezado) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Enlace a tu CSS -->
    <link rel="stylesheet" href="cafe.css">
</head>
<!-- Nueva clase para el body -->
<body class="pagina-editor">

    <!-- Cabecera Verde -->
    <header class="header-editor">
        <!-- Logo a la izquierda -->
        <div class="logo-editor-contenedor">
            <!-- Cambia el src por el nombre real de tu logo -->
            <img src="logo-cafe.jpeg" alt="Logo JIRL" class="logo-editor">
        </div>

        <!-- Textos de la cabecera -->
        <div class="textos-editor">
            <h1>Bienvenido Usuario Editor</h1>
            <h2>La mata de café JIRL</h2>
        </div>
    </header>

    <!-- Contenedor de los Botones -->
    <main class="contenedor-botones-editor">
        
        <a href="editar-cafe.html" class="boton-editor">Agregar o editar café</a>
        <a href="tablas-compras.html" class="boton-editor">Mostrar tablas de compras</a>
        
    </main>

</body>
</html>
