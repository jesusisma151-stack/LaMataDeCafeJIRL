<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipos de Café</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="cafe.css">
</head>
<body class="pagina-calidad">

    <header class="header-calidad">
        <h1>Tipos de café</h1>
    </header>

    <main class="contenedor-calidad" id="contenedor-publico">
        <!-- Aquí JavaScript inyectará los cafés de Firebase -->
    </main>

    <script type="module">
        // 1. Importar Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // 2. Configuración
        const firebaseConfig = {
            apiKey: "AIzaSyArLu0w7UVtuGufLfE1K7nLGD8NNScSPoY",
            authDomain: "lamatadecafejirl.firebaseapp.com",
            databaseURL: "https://lamatadecafejirl-default-rtdb.firebaseio.com",
            projectId: "lamatadecafejirl",
            storageBucket: "lamatadecafejirl.firebasestorage.app",
            messagingSenderId: "755151796533",
            appId: "1:755151796533:web:7787740e611d5aaaba347c"
        };

        // 3. Inicializar
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // 4. Función para dibujar
        function renderizarPublico() {
            const contenedor = document.getElementById('contenedor-publico');
            contenedor.innerHTML = '<p style="text-align:center; width:100%;">Cargando cafés desde la nube...</p>'; 

            const cafesRef = ref(db, 'cafes/');
            
            // Escuchar cambios en tiempo real
            onValue(cafesRef, (snapshot) => {
                const data = snapshot.val();
                contenedor.innerHTML = ''; // Limpiar pantalla

                if (data) {
                    // Recorremos los datos de Firebase
                    Object.keys(data).forEach((key) => {
                        const cafe = data[key];
                        
                        const fila = document.createElement('div');
                        fila.className = 'fila-calidad';
                        
                        // IMPORTANTE: Pasamos la "key" de Firebase en el enlace
                        fila.innerHTML = `
                            <h2 class="titulo-calidad">${cafe.nombre}</h2>
                            <a href="info-cafe.html?id=${key}" class="boton-info">Información</a>
                            <img src="${cafe.imagen}" alt="${cafe.nombre}" class="img-calidad">
                        `;
                        contenedor.appendChild(fila);
                    });
                } else {
                    contenedor.innerHTML = '<p style="text-align:center; width:100%;">Aún no hay cafés registrados en la nube.</p>';
                }
            });
        }

        // Iniciar
        renderizarPublico();
    </script>
</body>
</html>
